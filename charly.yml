# Makes this plugin repo a PROJECT so its own candy is actually gated.
#
# Without a root charly.yml the repo is "project-less": charly scans NO candies at all,
# so `charly box validate` at the repo root exits 0 on ANY manifest, including one with
# a malformed `plugin.providers` entry. The stock candy CI step asserted nothing.
# See opencharly/charly#459.
#
# Declaring discover: is the whole fix: the candy is scanned, the CUE schema gate
# applies, and the STOCK `charly box validate` step starts working with no workflow
# change. This file declares no entities of its own - it only tells charly where to look.
version: 2026.249.2125
discover:
    - path: candy
      recursive: true

check-preempt-app:
    local:
        description: |-
            Minimal kind:local template for the check-preempt-local bed — composes the
            command-only candy/plugin-preempt (no install content) so the bed exercises the
            externalized `charly preempt` CLI host-side.
        candy:
            - plugin-preempt
check-preempt-local:
    local:
        from: check-preempt-app
        host: local
        disposable: true
        lifecycle: dev
        description: >-
            Sole proof of the externalized `charly preempt` COMMAND (candy/plugin-preempt, command:preempt), COMPILED-IN and owning the CLI + lease-table formatting. A disposable kind:local deploy on host: local runs `charly preempt status` host-side: the compiled-in command's Invoke(OpRun) reaches its peer verb:arbiter DIRECTLY via InvokeProvider over the in-proc reverse channel (the arbiter's own host dependencies flow over TWO generic reverse legs — gather/resources over the resolved-project envelope, the rest over InvokeProvider; see candy/plugin-preempt's own description) — no hidden core-command forward, no in-core proxy hop. status exits 0 with a well-formed lease table naming no lease owned by THIS bed (sibling beds' transient leases are legitimate under a parallel roster) — proving the externalized command + the InvokeProvider peer-dispatch end-to-end. The live `restore`/reconcile step is intentionally omitted (it reads the operator's global lease ledger, so an eval bed must not run it); its reconcile→gather/start path stays covered by the Go e2e (TestArbiter_ReconcileStrandedRestores + TestArbiterExternalizedDispatch_AcquirePersistsAndSurfaces) + the check-preempt-arbiter-pod bed.
        plan:
            - check: command=charly preempt status exits 0 and names no lease owned by THIS bed — bed-owned scoping, because a concurrent sibling bed's transient lease is legitimate (a global no-leases assertion can never hold under a parallel roster)
              id: preempt-status-runs
              exit_status: 0
              stdout:
                - not_matches: '(^|[[:space:]])check-preempt-local([[:space:]]|$)'
              context:
                - runtime
              command:
                command: ${CHARLY_BIN} preempt status
                in_container: false
